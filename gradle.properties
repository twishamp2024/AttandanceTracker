# JVM args for the Gradle daemon. 4g is comfortable for a single-module Compose app.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# The system default JDK on this machine is Temurin 25, which AGP does not support.
# Android Studio's bundled JBR 21 is the supported toolchain, so pin the daemon to it.
# If you move this project to another machine, update or remove this line.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official
